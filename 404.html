<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Página não encontrada | Rock Your Business</title>
  <link rel="icon" href="/assets/iconRYB-BlackOrange.svg" type="image/svg+xml">
  <style>
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
    main{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{max-width:560px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:44px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    img{height:34px;width:auto;margin-bottom:28px}
    h1{font-size:28px;margin:0 0 12px}
    p{color:#64748b;line-height:1.6;margin:0 0 26px}
    a{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 22px;background:#fa4700;color:#111827;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
<main>
  <section class="card">
    <img src="/assets/logoRYB-BlackOrange.svg" alt="Rock Your Business">
    <h1>Página não encontrada</h1>
    <p>O endereço informado não existe ou não está disponível.</p>
    <a href="/">Voltar para o início</a>
  </section>
</main>
<script>
  (() => {
    const params = new URLSearchParams(location.search);
    const original = params.get('path');
    if (original && original.startsWith('/') && !original.startsWith('//')) {
      history.replaceState(null, '', original);
    }
  })();
</script>
</body>
</html>
